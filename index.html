<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Trening – PRO</title>

<style>
:root{
--bg:#0f172a;
--panel:#1e293b;
--text:#f1f5f9;
--muted:#94a3b8;
--yellow:#facc15;
--orange:#f97316;
--purple:#a855f7;
--blue:#3b82f6;
--red:#ef4444;
--green:#22c55e;
}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui;padding:15px}
h1{margin:0 0 10px 0}
.panel{background:var(--panel);padding:15px;border-radius:14px;margin-bottom:15px}
textarea,input,select{width:100%;background:#0b1220;border:1px solid #334155;color:var(--text);padding:10px;border-radius:10px}
button{background:#334155;border:0;color:white;padding:10px 14px;border-radius:10px;font-weight:bold;cursor:pointer}
button:hover{opacity:.9}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.teamCard{background:#0b1220;padding:10px;border-radius:12px;margin-top:10px}
.small{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{padding:6px;border-bottom:1px solid #334155;font-size:13px}
</style>
</head>

<body>

<h1>Trening – PRO ⚽</h1>

<div class="panel">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
<div><b>Ilość drużyn</b></div>
<select id="teamCount">
<option value="2">2</option>
<option value="3" selected>3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
</select>
</div>

<div id="teamNamesBox" style="margin-top:10px"></div>

<textarea id="players" placeholder="Tomek 5&#10;Kuba 4&#10;Bartek&#10;..."></textarea>

<div class="row">
<button id="drawBtn">Losuj (balans siły)</button>
<button id="copyTeamsBtn">Kopiuj składy</button>
</div>

<div id="teamsContainer"></div>
</div>

<div class="panel">
<h3>Turniej</h3>
<div id="nextMatch"></div>
<div id="restInfo" class="small"></div>

<div class="row">
<input type="number" id="g1" placeholder="Gole 1">
<input type="number" id="g2" placeholder="Gole 2">
<button id="addResult">Dodaj wynik</button>
<button id="copyTable">Kopiuj tabelę</button>
</div>

<table>
<thead>
<tr><th>Drużyna</th><th>M</th><th>Z</th><th>R</th><th>P</th><th>Bramki</th><th>Pkt</th></tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<table>
<thead>
<tr><th>#</th><th>Mecz</th><th>Wynik</th></tr>
</thead>
<tbody id="matchesBody"></tbody>
</table>

<div class="row">
<button id="saveTraining">Zapisz trening</button>
<button id="resetCup">Reset turnieju</button>
</div>
</div>

<div class="panel">
<h3>Historia treningów</h3>
<div id="history"></div>
</div>

<script>

const COLORS=["yellow","orange","purple","blue","red","green"];
let teams=[];
let scheduleIndex=0;
let matches=[];

function getTeamCount(){
return Number(document.getElementById("teamCount").value);
}

function renderTeamNameInputs(){
const n=getTeamCount();
const box=document.getElementById("teamNamesBox");
box.innerHTML="";
for(let i=0;i<n;i++){
box.innerHTML+=`<input data-i="${i}" placeholder="Nazwa drużyny ${i+1}" style="margin-bottom:5px">`;
}
}

document.getElementById("teamCount").addEventListener("change",()=>{
renderTeamNameInputs();
resetTournament();
});

renderTeamNameInputs();

function parsePlayers(){
const raw=document.getElementById("players").value.split("\n").map(x=>x.trim()).filter(Boolean);
return raw.map(r=>{
const parts=r.split(" ");
let power=3;
if(!isNaN(parts[parts.length-1])){
power=Number(parts.pop());
}
return {name:parts.join(" "),power};
});
}

function balance(players,n){
players.sort((a,b)=>b.power-a.power);
let buckets=Array.from({length:n},()=>({sum:0,list:[]}));
for(const p of players){
buckets.sort((a,b)=>a.sum-b.sum);
buckets[0].list.push(p);
buckets[0].sum+=p.power;
}
return buckets;
}

function drawTeams(){
const n=getTeamCount();
const players=parsePlayers();
if(players.length<n)return alert("Za mało zawodników");
const buckets=balance(players,n);
teams=buckets.map((b,i)=>{
const custom=document.querySelector(`[data-i='${i}']`).value;
return {
name:custom||`Drużyna ${i+1}`,
color:COLORS[i],
players:b.list,
sum:b.sum
};
});
renderTeams();
resetTournament();
}

function renderTeams(){
const box=document.getElementById("teamsContainer");
box.innerHTML="";
teams.forEach(t=>{
box.innerHTML+=`
<div class="teamCard">
<b>${t.name}</b> (suma ${t.sum})
<ul>${t.players.map(p=>`<li>${p.name} (${p.power})</li>`).join("")}</ul>
</div>`;
});
}

document.getElementById("drawBtn").onclick=drawTeams;

document.getElementById("copyTeamsBtn").onclick=()=>{
let text="SKŁADY:\n\n";
teams.forEach(t=>{
text+=`${t.name}:\n`;
t.players.forEach(p=>text+=`- ${p.name}\n`);
text+="\n";
});
navigator.clipboard.writeText(text);
};

function getNextMatch(){
const n=teams.length;
if(n===3){
const pattern=[
[0,1],[0,2],[1,2]
];
return pattern[scheduleIndex%3];
}else{
return [scheduleIndex%n,(scheduleIndex+1)%n];
}
}

function updateNextMatch(){
if(teams.length<2)return;
const [a,b]=getNextMatch();
document.getElementById("nextMatch").innerHTML=`<b>Następny mecz:</b> ${teams[a].name} - ${teams[b].name}`;
const rest=teams.map((t,i)=>i).filter(i=>i!==a&&i!==b).map(i=>teams[i].name).join(", ");
document.getElementById("restInfo").innerText="Pauza: "+(rest||"—");
}

function resetTournament(){
scheduleIndex=0;
matches=[];
updateNextMatch();
renderTable();
}

document.getElementById("addResult").onclick=()=>{
const g1=Number(document.getElementById("g1").value);
const g2=Number(document.getElementById("g2").value);
if(isNaN(g1)||isNaN(g2))return;
const [a,b]=getNextMatch();
matches.push({a,b,g1,g2});
scheduleIndex++;
updateNextMatch();
renderTable();
document.getElementById("g1").value="";
document.getElementById("g2").value="";
};

function renderTable(){
let stats=teams.map(t=>({name:t.name,M:0,Z:0,R:0,P:0,GF:0,GA:0,Pkt:0}));
matches.forEach(m=>{
let A=stats[m.a],B=stats[m.b];
A.M++;B.M++;
A.GF+=m.g1;A.GA+=m.g2;
B.GF+=m.g2;B.GA+=m.g1;
if(m.g1>m.g2){A.Z++;B.P++;A.Pkt+=3}
else if(m.g2>m.g1){B.Z++;A.P++;B.Pkt+=3}
else{A.R++;B.R++;A.Pkt++;B.Pkt++}
});
stats.sort((x,y)=>y.Pkt-x.Pkt||(y.GF-y.GA)-(x.GF-x.GA)||y.GF-x.GF);

const tb=document.getElementById("tableBody");
tb.innerHTML="";
stats.forEach(s=>{
tb.innerHTML+=`<tr>
<td>${s.name}</td><td>${s.M}</td><td>${s.Z}</td><td>${s.R}</td><td>${s.P}</td>
<td>${s.GF}-${s.GA}</td><td>${s.Pkt}</td>
</tr>`;
});

const mb=document.getElementById("matchesBody");
mb.innerHTML="";
matches.forEach((m,i)=>{
mb.innerHTML+=`<tr>
<td>${i+1}</td>
<td>${teams[m.a].name} - ${teams[m.b].name}</td>
<td>${m.g1}:${m.g2}</td>
</tr>`;
});
}

document.getElementById("copyTable").onclick=()=>{
let text="TABELA:\n";
document.querySelectorAll("#tableBody tr").forEach(tr=>{
text+=tr.innerText+"\n";
});
navigator.clipboard.writeText(text);
};

document.getElementById("saveTraining").onclick=()=>{
const history=JSON.parse(localStorage.getItem("trainingHistory")||"[]");
history.unshift({
date:new Date().toLocaleString(),
teams,
matches
});
localStorage.setItem("trainingHistory",JSON.stringify(history));
renderHistory();
};

function renderHistory(){
const history=JSON.parse(localStorage.getItem("trainingHistory")||"[]");
const box=document.getElementById("history");
box.innerHTML="";
history.forEach((h,i)=>{
box.innerHTML+=`
<div class="teamCard">
<b>${h.date}</b>
<div class="row">
<button onclick="loadTraining(${i})">Wczytaj</button>
<button onclick="deleteTraining(${i})">Usuń</button>
</div>
</div>`;
});
}

window.loadTraining=function(i){
const history=JSON.parse(localStorage.getItem("trainingHistory")||"[]");
const h=history[i];
teams=h.teams;
matches=h.matches;
scheduleIndex=matches.length%teams.length;
renderTeams();
renderTable();
updateNextMatch();
};

window.deleteTraining=function(i){
let history=JSON.parse(localStorage.getItem("trainingHistory")||"[]");
history.splice(i,1);
localStorage.setItem("trainingHistory",JSON.stringify(history));
renderHistory();
};

renderHistory();
updateNextMatch();

</script>
</body>
</html>
